<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JR Intelligence — hero preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shopify-theme/assets/jr.css">
  </head>
  <body class="jr-body">
    <header class="jr-header">
      <div class="jr-container jr-header__inner">
        <a href="#" class="jr-logo"><strong>JR</strong> <span>Intelligence</span></a>
        <nav class="jr-nav">
          <a href="#">Webshop</a>
          <a href="#">App</a>
          <a href="#">Prijzen</a>
          <a href="#">Over ons</a>
          <a href="#">Contact</a>
        </nav>
        <div class="jr-header__actions">
          <a class="jr-btn jr-btn--primary jr-header__cta" href="#">Offerte aanvragen</a>
        </div>
      </div>
    </header>
    <main>
      <section class="jr-showcase">
        <div class="jr-showcase__media" aria-hidden="true">
          <img class="jr-showcase__collage" src="shopify-theme/assets/hero-collage.png" alt="">
        </div>
        <div class="jr-container jr-showcase__inner">
          <div class="jr-showcase__copy">
            <h1>
              Webshop of app<br>
              <span class="jr-scribble">op&nbsp;maat
                <img class="jr-scribble__mark" src="shopify-theme/assets/underline-scratch.png" alt="">
              </span><br>
              voor jouw bedrijf
            </h1>
            <p class="jr-showcase__lede">Wij bouwen overzichtelijke webshops en apps die passen bij hoe jullie werken. Strak ontwerp, heldere prijzen, korte lijnen.</p>
            <div class="jr-showcase__actions">
              <a class="jr-btn jr-btn--primary jr-btn--lg" href="#">Offerte aanvragen</a>
            </div>
          </div>
          <div class="jr-showcase__devices">
            <img src="shopify-theme/assets/hero-devices.png" alt="Webshop en app op laptop en telefoon">
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
