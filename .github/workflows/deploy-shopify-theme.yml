name: Deploy Shopify theme

on:
  push:
    branches:
      - cursor/jrwebshop-v2-a69a
    paths:
      - "shopify-theme/**"
      - ".github/workflows/deploy-shopify-theme.yml"
  workflow_dispatch:

concurrency:
  group: shopify-live-theme
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Push the new theme live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Remove the old shop files
        env:
          SHOPIFY_FLAG_FORCE: "1"
        run: |
          rm -rf shopify-live-theme
          mkdir -p shopify-live-theme
          rsync -a --exclude index.html shopify-theme/ shopify-live-theme/
          rm -f shopify-live-theme/templates/index.json
          shopify theme push \
            --json \
            --allow-live \
            --ignore UPLOAD.txt \
            --path shopify-live-theme \
            --theme "${{ secrets.SHOPIFY_THEME_ID }}" \
            --store "${{ secrets.SHOPIFY_FLAG_STORE }}" \
            --password "${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}" \
            | tee /tmp/theme-push-clear.txt
          python3 scripts/check-theme-push.py /tmp/theme-push-clear.txt

      - name: Upload the homepage
        env:
          SHOPIFY_FLAG_FORCE: "1"
        run: |
          cp shopify-theme/templates/index.json shopify-live-theme/templates/index.json
          shopify theme push \
            --json \
            --allow-live \
            --ignore UPLOAD.txt \
            --path shopify-live-theme \
            --theme "${{ secrets.SHOPIFY_THEME_ID }}" \
            --store "${{ secrets.SHOPIFY_FLAG_STORE }}" \
            --password "${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}" \
            | tee /tmp/theme-push-home.txt
          python3 scripts/check-theme-push.py /tmp/theme-push-home.txt
