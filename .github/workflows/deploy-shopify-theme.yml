name: Deploy Shopify theme

on:
  push:
    branches:
      - cursor/jrwebshop-v2-a69a
    paths:
      - "shopify-theme/**"
      - "scripts/assemble-shopify-live-overlay.py"
      - ".github/workflows/deploy-shopify-theme.yml"
  workflow_dispatch:

concurrency:
  group: shopify-live-theme
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Push the V2 homepage onto the live theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the current live theme
        run: git fetch origin main --depth=1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Remove the old homepage template
        env:
          SHOPIFY_FLAG_FORCE: "1"
        run: |
          python3 scripts/assemble-shopify-live-overlay.py --skip-homepage
          shopify theme push \
            --json \
            --allow-live \
            --ignore UPLOAD.txt \
            --path shopify-live-overlay \
            --theme "${{ secrets.SHOPIFY_THEME_ID }}" \
            --store "${{ secrets.SHOPIFY_FLAG_STORE }}" \
            --password "${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}" \
            | tee /tmp/theme-push-clear.txt
          python3 scripts/check-theme-push.py /tmp/theme-push-clear.txt

      - name: Upload the new homepage
        env:
          SHOPIFY_FLAG_FORCE: "1"
        run: |
          cp shopify-theme/templates/index.json shopify-live-overlay/templates/index.json
          shopify theme push \
            --json \
            --allow-live \
            --ignore UPLOAD.txt \
            --path shopify-live-overlay \
            --theme "${{ secrets.SHOPIFY_THEME_ID }}" \
            --store "${{ secrets.SHOPIFY_FLAG_STORE }}" \
            --password "${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}" \
            | tee /tmp/theme-push-home.txt
          python3 scripts/check-theme-push.py /tmp/theme-push-home.txt
