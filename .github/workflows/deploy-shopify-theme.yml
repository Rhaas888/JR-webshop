name: Deploy Shopify theme

on:
  push:
    branches:
      - cursor/jrwebshop-v2-a69a
    paths:
      - "shopify-theme/**"
      - "scripts/assemble-shopify-live-overlay.py"
      - ".github/workflows/deploy-shopify-theme.yml"
  workflow_dispatch:

concurrency:
  group: shopify-live-theme
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Push the V2 homepage onto the live theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the current live theme
        run: git fetch origin main --depth=1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble live theme
        run: python3 scripts/assemble-shopify-live-overlay.py

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Upload theme
        env:
          SHOPIFY_FLAG_FORCE: "1"
        run: |
          shopify theme push \
            --json \
            --allow-live \
            --ignore UPLOAD.txt \
            --path shopify-live-overlay \
            --theme "${{ secrets.SHOPIFY_THEME_ID }}" \
            --store "${{ secrets.SHOPIFY_FLAG_STORE }}" \
            --password "${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}"
